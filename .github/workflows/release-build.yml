name: Release build

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Release ref used for tag-version validation
        required: true
        type: string
      signed_release:
        description: Require platform signing before publication
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked --extra dev --extra xlsx --group dev

      - name: Lint Python
        run: uv run --locked ruff check src tests

      - name: Type-check Python
        run: uv run --locked mypy src tests

      - name: Test Python
        run: uv run --locked pytest

      - name: Audit all locked Python platform dependencies
        run: uv run --locked python scripts/audit-dependencies.py

      - name: Verify tag matches package versions
        if: startsWith(inputs.checkout_ref, 'refs/tags/v')
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          expected = os.environ["CHECKOUT_REF"].removeprefix("refs/tags/v")
          python_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf8"))["project"]["version"]
          frontend_version = json.loads(Path("frontend/package.json").read_text(encoding="utf8"))["version"]
          versions = {"pyproject.toml": python_version, "frontend/package.json": frontend_version}
          mismatches = {path: version for path, version in versions.items() if version != expected}
          if mismatches:
              details = ", ".join(f"{path}={version}" for path, version in mismatches.items())
              raise SystemExit(f"Tag v{expected} does not match {details}")
          print(f"Release tag v{expected} matches all package versions.")
          PY

      - name: Install browser runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend and shipped Electron dependencies
        working-directory: frontend
        run: |
          mkdir -p ../audit-evidence
          npm audit --include=peer --audit-level=low --json > ../audit-evidence/npm-audit.json

      - name: Save dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gofer-flow-audit-evidence
          path: audit-evidence/*
          if-no-files-found: error

      - name: Lint frontend source
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Browser-test workflow studio
        working-directory: frontend
        run: xvfb-run -a npm run test:browser

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            electron_builder_args: --linux AppImage deb rpm
            artifact-name: gofer-flow-linux
            artifact-glob: |
              frontend/release/*.AppImage
              frontend/release/*.AppImage.blockmap
              frontend/release/*.deb
              frontend/release/*.rpm
              frontend/release/latest-linux.yml
              frontend/release/gof-linux-x64
              frontend/release/checksums-linux.txt
          - name: windows
            os: windows-latest
            electron_builder_args: --win nsis
            artifact-name: gofer-flow-windows
            artifact-glob: |
              frontend/release/*.exe
              frontend/release/*.exe.blockmap
              frontend/release/latest.yml
              frontend/release/checksums-windows.txt
              frontend/release/signatures-windows.json
          - name: macos
            os: macos-latest
            electron_builder_args: --mac dmg zip
            artifact-name: gofer-flow-macos
            artifact-glob: |
              frontend/release/*.dmg
              frontend/release/*.dmg.blockmap
              frontend/release/*.zip
              frontend/release/*.zip.blockmap
              frontend/release/latest-mac.yml
              frontend/release/gof-macos-*
              frontend/release/checksums-macos.txt
              frontend/release/notarization-macos-*.json

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm xvfb

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra xlsx --group dev

      - name: Test platform filesystem security
        run: uv run --locked pytest tests/unit/test_atomic_output.py tests/unit/test_native_filesystem_security.py tests/unit/test_resource_security.py tests/unit/test_radish_workspaces.py

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Require Windows signing credentials
        env:
          CSC_LINK: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD) || '' }}
        if: inputs.signed_release && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw "Release requires WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD."
          }

      - name: Prepare macOS signing keychain
        env:
          CSC_LINK: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD) || '' }}
          APPLE_ID: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          GOFER_CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        if: inputs.signed_release && runner.os == 'macOS'
        shell: bash
        run: scripts/prepare-macos-signing.sh

      - name: Build backend
        working-directory: frontend
        env:
          GOFER_CODESIGN_IDENTITY: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.MACOS_SIGNING_IDENTITY || '' }}
        run: npm run backend:build

      - name: Sign Windows backend before packaging
        env:
          CSC_LINK: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD) || '' }}
        if: inputs.signed_release && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/sign-windows-backend.ps1

      - name: Build Electron packages
        working-directory: frontend
        shell: bash
        env:
          CSC_LINK: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD) || '' }}
          APPLE_ID: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          SIGNED_RELEASE: ${{ inputs.signed_release }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.signed_release && 'true' || 'false' }}
        run: |
          npm run build
          signing_args=()
          if [ "$SIGNED_RELEASE" = "true" ] && [ "$RUNNER_OS" != "Linux" ]; then
            signing_args+=(--config.forceCodeSigning=true)
            if [ "$RUNNER_OS" = "macOS" ]; then
              signing_args+=(--config.mac.notarize=true --config.dmg.sign=true)
            fi
          fi
          npx --no-install electron-builder ${{ matrix.electron_builder_args }} "${signing_args[@]}" --publish=never

      - name: Test native terminal and Electron security on packaged runtime version
        working-directory: frontend
        run: npm run test:platform

      - name: Delete temporary macOS signing keychain
        if: always() && inputs.signed_release && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/taskurotta-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/taskurotta-signing.p12"

      - name: Copy Linux CLI artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp dist/gof frontend/release/gof-linux-x64
          chmod +x frontend/release/gof-linux-x64

      - name: Build Linux CLI packages
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/package-cli-linux.sh dist/gof frontend/release

      - name: Copy Windows CLI artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/gof.exe frontend/release/gof-windows-x64.exe

      - name: Copy macOS CLI artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch="$(uname -m)"
          case "$arch" in
            arm64) artifact_arch="arm64" ;;
            x86_64) artifact_arch="x64" ;;
            *) artifact_arch="$arch" ;;
          esac
          cp dist/gof "frontend/release/gof-macos-${artifact_arch}"
          chmod +x "frontend/release/gof-macos-${artifact_arch}"

      - name: Verify Windows release signatures
        if: inputs.signed_release && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1

      - name: Verify macOS signatures and notarization
        env:
          APPLE_ID: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        if: inputs.signed_release && runner.os == 'macOS'
        shell: bash
        run: scripts/verify-macos-release.sh

      - name: Generate Linux checksums
        if: runner.os == 'Linux'
        working-directory: frontend/release
        shell: bash
        run: |
          files=()
          for pattern in *.AppImage *.AppImage.blockmap *.deb *.rpm latest-linux.yml gof-linux-x64; do
            for file in $pattern; do
              [ -e "$file" ] && files+=("$file")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Linux release files found for checksums" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums-linux.txt
          cat checksums-linux.txt

      - name: Generate Windows checksums
        if: runner.os == 'Windows'
        working-directory: frontend/release
        shell: pwsh
        run: |
          Get-ChildItem -File |
            Where-Object { $_.Name -like "*.exe" -or $_.Name -like "*.exe.blockmap" -or $_.Name -eq "latest.yml" -or $_.Name -eq "signatures-windows.json" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 $_.FullName
              "$($hash.Hash.ToLower())  $($_.Name)"
            } | Set-Content checksums-windows.txt
          Get-Content checksums-windows.txt

      - name: Generate macOS checksums
        if: runner.os == 'macOS'
        working-directory: frontend/release
        shell: bash
        run: |
          files=()
          for pattern in *.dmg *.dmg.blockmap *.zip *.zip.blockmap latest-mac.yml gof-macos-* notarization-macos-*.json; do
            for file in $pattern; do
              [ -e "$file" ] && files+=("$file")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No macOS release files found for checksums" >&2
            exit 1
          fi
          shasum -a 256 "${files[@]}" > checksums-macos.txt
          cat checksums-macos.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
